<!DOCTYPE html>
<!-- The same step in Spanish, as WodBuster served it before 2026-11-13: the
     English fixture with the visible text translated. -->
<html lang="es"><head><meta charset="utf-8"><title>Iniciar sesión - WodBuster</title></head>
<body>
<form method="post" action="./login.aspx" id="form">
  <h2>Iniciar sesión</h2>
  <div id="body_body_CtlUp">
    <h3>¿Recordar este dispositivo?</h3>
    <label class="button">
      <input id="body_body_CtlConfiar_CtlSeguro" type="radio" name="ctl00$ctl00$body$body$CtlConfiar$dispositivo" value="CtlSeguro" onclick="document.body.setAttribute('data-picked','CtlSeguro')"><label for="body_body_CtlConfiar_CtlSeguro">✅ Recordar este dispositivo</label>
      <span>👉 No tendrás que iniciar sesión la próxima vez.</span>
    </label>
    <label class="button">
      <input id="body_body_CtlConfiar_CtlNoSeguro" type="radio" name="ctl00$ctl00$body$body$CtlConfiar$dispositivo" value="CtlNoSeguro" onclick="document.body.setAttribute('data-picked','CtlNoSeguro')"><label for="body_body_CtlConfiar_CtlNoSeguro">🔒 No recordar</label>
      <span>👉 Te pediremos la contraseña la próxima vez.</span>
    </label>
  </div>
</form>
</body></html>
